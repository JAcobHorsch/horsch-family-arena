<!doctype html>
<meta charset="utf-8">
<title>weapons-d preview</title>
<style>
  body { margin: 0; background: #241c33; color: #e8e2f2; font: 12px/1.4 system-ui, sans-serif; }
  canvas { display: block; }
</style>
<canvas id="c" width="1500" height="1180"></canvas>
<script src="js/data.js"></script>
<script src="js/weapons-d.js"></script>
<script>
  const SHADE = new Map();
  function ramp(c) {
    let r = SHADE.get(c);
    if (!r) {
      r = { out: hexMix(c, '#1a1030', 0.62), dk: hexMix(c, '#1a1030', 0.3), lt: hexMix(c, '#fff6dd', 0.28), hi: hexMix(c, '#fff6dd', 0.55) };
      SHADE.set(c, r);
    }
    return r;
  }
  const g = document.getElementById('c').getContext('2d');
  const w = {
    tier: 1, hx: 15, hy: -52, bx: 4, by: -50, ffx: 8, ffy: -4, bfx: -8, bfy: -4,
    shx: 6, shy: -60, hipx: 0, hipy: -34, attackKey: null, attackExt: 0,
    animT: 0, walkCyc: 0, isPlayer: true, colors: null, energy: '#ff7a2c',
    ramp: ramp, INK: '#14101a',
  };
  const IDS = ['hayes', 'addi', 'brooks', 'isla', 'dayne'];
  const POSES = [[null, 0], ['punch', 1], ['B', 1]];
  function frame(t) {
    g.fillStyle = '#241c33'; g.fillRect(0, 0, 1500, 1180);
    g.font = '12px system-ui';
    for (let r = 0; r < IDS.length; r++) {
      const body = window.WEAPON_BODIES[IDS[r]];
      for (let tier = 1; tier <= 5; tier++) {
        for (let p = 0; p < POSES.length; p++) {
          const ox = 60 + (tier - 1) * 290 + p * 92;
          const oy = 150 + r * 230;
          g.fillStyle = '#3a3050';
          g.fillRect(ox - 40, oy - 2, 84, 2);
          g.save();
          g.translate(ox, oy);
          g.lineCap = 'round'; g.lineJoin = 'round';
          // stand-ins for the fighter parts the weapon overlaps
          g.strokeStyle = '#5a4e78'; g.lineWidth = 6;
          g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -34); g.lineTo(w.shx, w.shy); g.stroke();
          g.beginPath(); g.moveTo(w.shx, w.shy); g.lineTo(w.hx, w.hy); g.stroke();
          w.tier = tier; w.attackKey = POSES[p][0]; w.attackExt = POSES[p][1]; w.animT = t;
          if (body.under) body.under(g, w);
          g.fillStyle = '#e8b58a';
          g.beginPath(); g.arc(w.hx, w.hy, 3.6, 0, 7); g.fill();
          g.beginPath(); g.arc(w.bx, w.by, 3.4, 0, 7); g.fill();
          if (body.over) body.over(g, w);
          g.restore();
          g.fillStyle = '#9a90b8';
          if (p === 0) g.fillText(IDS[r] + '  T' + tier, ox - 40, oy + 26);
        }
      }
    }
  }
  let t0 = performance.now();
  function loop(now) { frame((now - t0) / 1000); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
</script>
